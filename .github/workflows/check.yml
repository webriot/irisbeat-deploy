name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types -- -c wrangler.jsonc -c wrangler.delivery.jsonc
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:delivery
      - name: Generate runtime types for the standalone consumer
        run: npm run types -- --include-env=false
      - run: npm run test:consumer
      - run: npm run build
      - run: npm run build:delivery
